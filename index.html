<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Countdown</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🎉 Holiday Countdown</h1>
        <p class="subtitle">See how many days until the next celebration!</p>
        
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="major">Major</button>
            <button class="filter-btn" data-filter="cultural">Cultural</button>
            <button class="filter-btn" data-filter="seasonal">Seasonal</button>
        </div>

        <div class="holidays-grid" id="holidaysGrid">
            <!-- Holidays will be dynamically loaded here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

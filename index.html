<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Unlock the Game!</title>
                <style>
                        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
                                body, html { width: 100%; height: 100%; background-color: #111; font-family: sans-serif; overflow: hidden; color: #fff; }
                                        #tracerCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
                                                #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,15,15,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.5s ease; text-align: center; padding: 20px; }
                                                        h1 { font-size: 2.5rem; margin-bottom: 20px; color: #ff0000; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
                                                                p { font-size: 1.2rem; margin-bottom: 30px; color: #ccc; }
                                                                        .btn { background-color: #ff0000; color: white; border: none; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,0,0,0.4); transition: transform 0.2s; text-decoration: none; display: inline-block; }
                                                                                .btn:hover { transform: scale(1.05); }
                                                                                        #game-container { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
                                                                                                #score-board { position: absolute; top: 20px; font-size: 1.5rem; font-weight: bold; background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 10px; }
                                                                                                        #game-canvas { background: #222; border: 2px solid #333; border-radius: 10px; max-width: 100%; max-height: 80vh; }
                                                                                                            </style>
                                                                                                            </head>
                                                                                                            <body>
                                                                                                                <canvas id="tracerCanvas"></canvas>
                                                                                                                    <div id="lock-screen">
                                                                                                                            <h1>⚠️ Content Locked ⚠️</h1>
                                                                                                                                    <p>Subscribe to my channel to unlock the game!</p>
                                                                                                                                            <a href="https://youtube.com/@cooldudevrbruh" target="_blank" class="btn" id="sub-button">🔴 Subscribe & Unlock</a>
                                                                                                                                                </div>
                                                                                                                                                    <div id="game-container">
                                                                                                                                                            <div id="score-board">Score: <span id="score">0</span></div>
                                                                                                                                                                    <canvas id="game-canvas" width="600" height="400"></canvas>
                                                                                                                                                                        </div>
                                                                                                                                                                            <script>        const tracerCanvas = document.getElementById('tracerCanvas');
                                                                                                                                                                                    const ctxTracer = tracerCanvas.getContext('2d');
                                                                                                                                                                                            let points = [];
                                                                                                                                                                                                    function resizeCanvas() { tracerCanvas.width = window.innerWidth; tracerCanvas.height = window.innerHeight; }
                                                                                                                                                                                                            window.addEventListener('resize', resizeCanvas);
                                                                                                                                                                                                                    resizeCanvas();
                                                                                                                                                                                                                            function addPoint(x, y) { points.push({ x, y, age: 0 }); }
                                                                                                                                                                                                                                    window.addEventListener('mousemove', (e) => { addPoint(e.clientX, e.clientY); });
                                                                                                                                                                                                                                            window.addEventListener('touchmove', (e) => { if(e.touches.length > 0) addPoint(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
                                                                                                                                                                                                                                                    function animateTracers() {
                                                                                                                                                                                                                                                                ctxTracer.clearRect(0, 0, tracerCanvas.width, tracerCanvas.height);
                                                                                                                                                                                                                                                                            if (points.length > 1) {
                                                                                                                                                                                                                                                                                            ctxTracer.beginPath(); ctxTracer.moveTo(points[0].x, points[0].y);
                                                                                                                                                                                                                                                                                                            for (let i = 1; i < points.length; i++) { ctxTracer.lineTo(points[i].x, points[i].y); }
                                                                                                                                                                                                                                                                                                                            ctxTracer.strokeStyle = 'rgba(0, 150, 255, 0.8)'; ctxTracer.lineWidth = 5; ctxTracer.lineCap = 'round'; ctxTracer.lineJoin = 'round'; ctxTracer.shadowBlur = 15; ctxTracer.shadowColor = '#0096ff'; ctxTracer.stroke();
                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                    for (let i = 0; i < points.length; i++) { points[i].age += 1; }
                                                                                                                                                                                                                                                                                                                                                                points = points.filter(p => p.age < 15);
                                                                                                                                                                                                                                                                                                                                                                            requestAnimationFrame(animateTracers);
                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                            animateTracers();
                                                                                                                                                                                                                                                                                                                                                                                                    const subButton = document.getElementById('sub-button');
                                                                                                                                                                                                                                                                                                                                                                                                            const lockScreen = document.getElementById('lock-screen');
                                                                                                                                                                                                                                                                                                                                                                                                                    subButton.addEventListener('click', () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                setTimeout(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                lockScreen.style.opacity = '0';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                setTimeout(() => { lockScreen.style.display = 'none'; startGame(); }, 500);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }, 1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const gameCanvas = document.getElementById('game-canvas');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const ctxGame = gameCanvas.getContext('2d');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let score = 0; let target = { x: 0, y: 0, radius: 25 }; let gameRunning = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function moveTarget() { target.x = Math.random() * (gameCanvas.width - target.radius * 2) + target.radius; target.y = Math.random() * (gameCanvas.height - target.radius * 2) + target.radius; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function drawGame() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!gameRunning) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctxGame.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctxGame.beginPath(); ctxGame.arc(target.x, target.y, target.radius, 0, Math.PI * 2); ctxGame.fillStyle = '#ff0055'; ctxGame.fill(); ctxGame.strokeStyle = '#fff'; ctxGame.lineWidth = 3; ctxGame.stroke();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            requestAnimationFrame(drawGame);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function checkHit(inputX, inputY) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const rect = gameCanvas.getBoundingClientRect();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const canvasX = (inputX - rect.left) * (gameCanvas.width / rect.width);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const canvasY = (inputY - rect.top) * (gameCanvas.height / rect.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const dist = Math.sqrt((canvasX - target.x)**2 + (canvasY - target.y)**2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (dist < target.radius) { score++; document.getElementById('score').innerText = score; moveTarget(); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        gameCanvas.addEventListener('mousedown', (e) => checkHit(e.clientX, e.clientY));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                gameCanvas.addEventListener('touchstart', (e) => { if(e.touches.length > 0) checkHit(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function startGame() { gameRunning = true; moveTarget(); drawGame(); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
